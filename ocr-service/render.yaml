services:
  - type: web
    name: invoice-ocr-service
    runtime: docker
    dockerfilePath: ./ocr-service/Dockerfile
    dockerContext: ./ocr-service
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_FILE_SIZE_MB
        value: "15"
      - key: OCR_LANG
        value: "en"
      - key: USE_ANGLE_CLS
        value: "true"
